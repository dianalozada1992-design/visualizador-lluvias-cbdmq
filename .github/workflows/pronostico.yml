# Todos los dias a las 6h00 de Quito (11h00 UTC): boletin de pronostico de lluvia y envio al grupo de Telegram.
# El dia 1 de cada mes deja una marca en el repositorio: GitHub apaga las tareas programadas
# de los repositorios publicos que pasan 60 dias sin cambios.
name: Pronostico diario

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: pronostico
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pronostico:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: America/Guayaquil
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LICOR_TOKEN: ${{ secrets.LICOR_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nube/requirements.txt
      - run: pip install -r nube/requirements.txt
      - run: python nube/correr_pronostico.py
      - name: Guardar el boletin (descargable desde la pestana Actions)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boletin
          path: nube/pronostico/boletines/
          retention-days: 15
      - name: Mantener activas las tareas programadas
        if: always()
        run: |
          if [ "$(date +%d)" = "01" ]; then
            date "+%Y-%m-%d %H:%M" > .github/ultima_actividad.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/ultima_actividad.txt
            git commit -m "Marca mensual para mantener activas las tareas programadas" || true
            git push || true
          fi
